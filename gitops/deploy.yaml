apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: multi-app-route
  namespace: gateway-api-demo
spec:
  parentRefs:
  - name: traefik-gateway
  hostnames:
    - "traefikgw.34.16.10.39.nip.io"
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: pass-client-cert
    matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: python-app-traefikgw-service
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app-traefikgw
  namespace: gateway-api-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app-traefikgw
  template:
    metadata:
      labels:
        app: python-app-traefikgw
    spec:
      containers:
        - name: poc
          image: us-central1-docker.pkg.dev/playground-s-11-31f44a5d/my-repo/poc:v1
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: python-app-traefikgw-service
  namespace: gateway-api-demo
spec:
  type: ClusterIP
  selector:
    app: python-app-traefikgw
  ports:
    - port: 80
      targetPort: 8000