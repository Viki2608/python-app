apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-haproxy
  namespace: haproxy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-haproxy
  template:
    metadata:
      labels:
        app: python-haproxy
    spec:
      containers:
      - name: poc
        image: us-central1-docker.pkg.dev/playground-s-11-dec78e00/my-repo/poc:v1      
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-service
  namespace: haproxy-system
spec:
  type: ClusterIP
  selector:
    app: python-haproxy
  ports:
  - port: 80
    targetPort: 8000