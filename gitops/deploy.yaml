apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api-demo
  namespace: gateway-api-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api-demo
  template:
    metadata:
      labels:
        app: gateway-api-demo
    spec:
      containers:
      - name: poc
        # Removed the trailing dot from image name to ensure it's a valid K8s string
        image: us-central1-docker.pkg.dev/playground-s-11-99ef194c/my-repo/poc:v1
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api-demo-service
  namespace: gateway-api-demo
spec:
  type: ClusterIP 
  selector:
    app: gateway-api-demo
  ports:
  - port: 80
    targetPort: 8000