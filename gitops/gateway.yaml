# 1. The Gateway (Defines the listener and enforces mTLS)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-mtls-gateway
  namespace: default
spec:
  gatewayClassName: envoy
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    # hostname: "nginx.34.123.186.239.nip.io"
    tls:
      mode: Terminate
      certificateRefs:
      - name: nginx-server-certs
      # Standard Gateway API v1.1 mTLS validation
      frontendValidation:
        caCertificateRefs:
        - name: my-ca-secret
          kind: Secret
          group: ""

---
# 2. The HTTPRoute (Routes traffic to your unified FastAPI service)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envoy-python-route
  namespace: default
spec:
  parentRefs:
  - name: envoy-mtls-gateway
  # hostnames:
  # - "nginx.34.123.186.239.nip.io"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: python-nginx-service
      port: 80