apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: gateway-api-demo
  annotations:
    traefik.io/gateway-listeners-options: |
      https:
        tlsOptions: mtls-policy@kubernetescrd
spec:
  gatewayClassName: traefik-gateway-class

  listeners:
    - name: https
      hostname: "traefikgw.34.16.10.39.nip.io"
      protocol: HTTPS
      port: 443

      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: nginx-server-certs

      allowedRoutes:
        namespaces:
          from: All