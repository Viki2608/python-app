# 2. The Entry Point (Gateway)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: gateway-api-demo
  annotations:
    traefik.io/gateway-listeners-options: |
      https:
        tlsOptions: gateway-api-demo-mtls-policy@kubernetescrd
spec:
  gatewayClassName: traefik-gateway-class
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: nginx-server-certs # Your server certificate
    allowedRoutes:
      namespaces:
        from: All