# 1. The Gateway (Defines the listener and enforces mTLS)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-mtls-gateway
  namespace: envoy
spec:
  gatewayClassName: envoy
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "envoy.34.46.204.115.nip.io"
    tls:
      mode: Terminate
      certificateRefs:
      - name: nginx-server-certs
---
# 3. Envoy ClientTrafficPolicy (Enforces mTLS)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: enforce-mtls-policy
  namespace: envoy
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-mtls-gateway
  tls:
    clientValidation:
      caCertificateRefs:
      - name: my-ca-secret
        kind: Secret
        group: ""
---
# 2. The HTTPRoute (Routes traffic to your unified FastAPI service)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envoy-python-route
  namespace: envoy
spec:
  parentRefs:
  - name: envoy-mtls-gateway
  hostnames:
  - "envoy.34.46.204.115.nip.io"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: python-envoy-service
      port: 80