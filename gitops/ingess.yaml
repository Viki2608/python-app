apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: haproxy-ingress
  namespace: haproxy-system
  annotations:
    kubernetes.io/ingress.class: "haproxy"
    haproxy.org/ssl-client-verify: "required"
    haproxy.org/client-ca: "haproxy-system/my-ca-secret"
    haproxy.org/ssl-client-cert-header: "ssl-client-cert"
    haproxy.org/request-set-header: |
      x-proxy-id haproxy-ingress
spec:
  ingressClassName: haproxy
  tls:
  - hosts:
    - haproxy.34.122.191.191.nip.io
    secretName: haproxy-server-certs
  rules:
  - host: haproxy.34.122.191.191.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: haproxy-service
            port:
              number: 80